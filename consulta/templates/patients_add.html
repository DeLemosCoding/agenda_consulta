{% extends 'base.html' %}

{% block title %}

    Cadastrar Paciente | Vitta+
    
{% endblock %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="card-header bg-success text-white justify-content-center d-flex align-items-center pt-2 pb-2">

        <h3 class="mb-0">Cadastrar Paciente</h3>

    </div>

    <div class="card-body">

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

                <div class="d-flex justify-content-between mt-4">

                    <a href="{% url 'patients_list' %}" class="btn btn-primary">

                        Voltar

                    </a>

                    <button type="submit" class="btn btn-success">

                        Cadastrar paciente

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
