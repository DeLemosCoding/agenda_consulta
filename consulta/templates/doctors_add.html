{% extends 'base.html' %}

{% load static %}

{% block title %}

    Cadastrar Médico | Vitta+

{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8 col-lg-7">

            <div class="card-shadow">

                <div class="card-header bg-success text-white justify-content-center d-flex align-items-center">

                    <h3 class="mb-0">Cadastrar Médico</h3>

                </div>

                <div class="card-body">

                    <form method="post" enctype="multipart/form-data">

                        {% csrf_token %}

                        {{ form.as_p }}

                        <div class="d-flex justify-content-between mt-4">

                            <a href="{% url 'doctors_list' %}" class="btn btn-primary">Voltar</a>

                            <button type="submit" class="btn btn-success">Cadastrar Médico</button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
