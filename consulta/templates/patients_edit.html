{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h1 class="mb-4">Editar Paciente</h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">

            Salvar alterações

        </button>

        <a href="{% url 'patients_list' %}" class="btn btn-secondary">

            Cancelar

        </a>
        
    </form>

</div>

{% endblock %}
