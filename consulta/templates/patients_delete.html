{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h1 class="mb-4">Excluir Paciente</h1>

    <div class="alert alert-danger">

        <p>
            Tem certeza que deseja excluir o paciente
            <strong>{{ patient.name }}</strong>?
        </p>

        <p class="mb-0">
            Essa ação não poderá ser desfeita.
        </p>

    </div>

    <form method="post">

        {% csrf_token %}

        <button type="submit" class="btn btn-danger">

            Sim, excluir

        </button>

        <a href="{% url 'patients_list' %}" class="btn btn-secondary">

            Cancelar

        </a>

    </form>

</div>

{% endblock %}
